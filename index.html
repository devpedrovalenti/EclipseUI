<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" crossorigin="use-credentials" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000">
    <meta name="apple-mobile-web-app-title" content="Nitro">
    <meta name="application-name" content="Nitro">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <base href="./">
    <title>Nitro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="w-100 h-100"></div>
    <script>
      const queryParams = new URLSearchParams(window.location.search);
      const NitroConfig = {
        "config.urls": [ '/renderer-config.json', '/ui-config.json' ],
        "sso.ticket": (queryParams.get('sso') || queryParams.get('auth_ticket') || null),
        "forward.type": (queryParams.get('room') ? 2 : -1),
        "forward.id": (queryParams.get('room') || 0),
        "friend.id": (queryParams.get('friend') || 0),
      };

      if(window.location.port === '5173')
      {
        NitroConfig['asset.url'] = '/nitro-assets';
        NitroConfig['image.library.url'] = '/flash/c_images/';
        NitroConfig['hof.furni.url'] = '/flash/dcr/hof_furni';
        NitroConfig['camera.url'] = '/flash/c_images/camera/';
        NitroConfig['thumbnails.url'] = '/flash/c_images/camera/thumbnail/%thumbnail%.png';
      }
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
